name: CI

# The repo had no CI, so nothing enforced the lint gate and 24 lint problems
# accumulated on master unnoticed. These are the same four commands you'd run
# locally — keep them passing.
on:
  pull_request:
  push:
    branches: [master]

jobs:
  frontend:
    name: Lint, typecheck, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  edge-functions:
    name: Edge Function lint, check, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      # ESLint deliberately ignores supabase/functions (Deno globals, npm:
      # specifiers) — these are what keep that directory honest, including the
      # no-explicit-any ban. All three run from supabase/functions/, which is
      # where deno.json lives; from the repo root the imports don't resolve.
      - run: npm run lint:functions
      - run: npm run check:functions
      - run: npm test
