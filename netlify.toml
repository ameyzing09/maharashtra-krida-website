[build]
  command = "npm run build"
  publish = "dist"
# Public client config, inlined into the bundle by Vite at build time. The
# anon key is safe to commit — it's public by design and the data is protected
# by row-level security. (When the separate prod Supabase project exists, move
# these into [context.production.environment] / [context.deploy-preview.environment]
# so prod and previews point at their own projects.)
[build.environment]
  VITE_SUPABASE_URL = "https://admofuvpawimmotbubls.supabase.co"
  VITE_SUPABASE_ANON_KEY = "sb_publishable_mk-XMZSmlYEJ-jyecs5Puw_Ntn8q3wL"
[dev]
  command    = "npm run dev"   # Vite dev
  targetPort = 5173            # Vite's port (change if different)
  port       = 8888            # Netlify proxy port

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
